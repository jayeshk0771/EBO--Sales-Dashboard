<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOHECO EBO Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--g:#16A57E;--n:#17394A;--bg:#F4F8F7;--c:#fff;--r:#E57373}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--n)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
.card{background:var(--c);border-radius:10px;padding:14px;box-shadow:0 1px 4px #0002}
button,select,input{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #bcd}
button{background:var(--g);color:#fff;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:3px solid var(--g);flex-wrap:wrap}
header img{height:42px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:#e3efec;color:var(--n)}.tabs button.on{background:var(--g);color:#fff}
main{padding:16px 20px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.bar label{font-size:12px;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-left:5px solid var(--g);padding:10px 14px;border-radius:8px}.kpi b{font-size:22px;display:block}.kpi span{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-bottom:12px}
.wrap{overflow:auto;max-height:420px;margin-bottom:12px}table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th{background:var(--n);color:#fff;position:sticky;top:0;padding:6px 8px;text-align:left}td{padding:5px 8px;border-bottom:1px solid #e5eeec}
tr.no td{background:#FDE2E2}.cv{position:relative;height:280px}.gr{display:grid;gap:12px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));margin-bottom:12px}@media(max-width:1100px){.gr{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.gr{grid-template-columns:1fr}}
tr.tot td{font-weight:700;border-top:2px solid var(--n);background:#EEF6F4}.hide{display:none}.note{font-size:12px;opacity:.75}
</style></head><body>

<script>
const USERS={"admin@boheco.org":"Boheco@2026"};
const GREEN="#16A57E",NAVY="#17394A",RED="#E57373",PAL=[GREEN,NAVY,"#5CC8A8","#7A9BAA","#F2B84B",RED];
const $=id=>document.getElementById(id),inr=v=>"₹"+Math.round(v).toLocaleString("en-IN");
function show(id){["welcome","app"].forEach(x=>$(x).classList.toggle("hide",x!=id))}
const TABS=["1 · EBO Summary","2 · Appointments","3 · Customer → Products","4 · Product Analysis"];
$("tabs").innerHTML=TABS.map((t,i)=>`<button onclick="tab(${i})" id="tb${i}" class="${i?"":"on"}">${t}</button>`).join("");
function tab(i){TABS.forEach((_,j)=>{$("t"+j).classList.toggle("hide",j!=i);$("tb"+j).classList.toggle("on",j==i)})}
// ===== helpers =====
const last10=s=>{const d=String(s??"").replace(/\D/g,"");return d.length>=10?d.slice(-10):null};
const norm=s=>s==null?null:String(s).toLowerCase().trim().replace(/\s+/g," ");
const dt=v=>{if(v==null||v==="")return null;let d=(v&&typeof v.getTime=="function")?new Date(v.getTime()+432e5):new Date(String(v).replace(" ","T"));return isNaN(d)?null:d};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fyOf=d=>{const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return`FY ${y}-${String(y+1).slice(-2)}`};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function groupBy(a,f){const m=new Map();a.forEach(x=>{const k=f(x);(m.get(k)||m.set(k,[]).get(k)).push(x)});return m}
const charts={};function chart(id,type,labels,sets,opt={}){try{const c=charts[id],cv=$(id);
 if(window.Chart&&Chart.defaults&&Chart.defaults.font)Chart.defaults.font.size=11;
 if(c&&c.canvas===cv&&c.config.type===type&&document.body.contains(cv)){c.data.labels=labels;c.data.datasets=sets;c.update();return}
 if(c){try{c.destroy()}catch(e){}}
 const o=Object.assign({responsive:true,maintainAspectRatio:false},opt);
 o.plugins=Object.assign({legend:{display:sets.length>1||["pie","doughnut"].includes(type),position:"bottom",labels:{boxWidth:10}}},opt.plugins||{});
 charts[id]=new Chart(cv,{type,data:{labels,datasets:sets},options:o})}catch(e){console.error(id,e)}}
const tbl=(cols,rows,cls)=>`<div class="wrap"><table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${rows.map((r,i)=>`<tr class="${cls?cls(i):""}">${r.map(c=>`<td>${c??""}</td>`).join("")}</tr>`).join("")}</table></div>`;
const kpis=a=>`<div class="kpis">${a.map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
const sel=(id,opts,all="All")=>`<div><label>${id}</label><select data-f="${id}" onchange="render()"><option value="">${all}</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select></div>`;
const fv=id=>{const e=document.querySelector(`[data-f="${id}"]`);return e?e.value:""};
let INV=[],AP=[],TG=[];
// ===== load =====
$("file").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
 try{load(XLSX.read(await f.arrayBuffer(),{cellDates:true}))}catch(x){alert("Could not read the file: "+x.message)}});
function load(wb){
 const J=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{raw:true,defval:null});
 const ap=J("Appointments").map(r=>{const d=dt(r["Appointment Date/Time"]),age=parseFloat(r.Age);
  const ph=last10(r.Mobile),nm=norm(r["Contact Name"]);
  return{no:r["Appointment No"],name:r["Contact Name"],mobile:r.Mobile,phone:ph,nameN:nm,key:ph||("NM:"+(nm||r["Appointment No"])),date:d,
   age:isNaN(age)?null:age,band:isNaN(age)?"Unknown":age<18?"<18":age<=25?"18-25":age<=35?"26-35":age<=45?"36-45":age<=55?"46-55":age<=65?"56-65":"65+",
   gender:r.Gender||"Unknown",tag:r.Tag||"Untagged",doc:(r["Dr Appointment Owner"]||"Unassigned").replace(/\s+/g," ").trim(),status:r.Status||""}});
 const keys=new Set(ap.map(a=>a.key)),n2k=new Map();ap.forEach(a=>{if(a.nameN&&!n2k.has(a.nameN))n2k.set(a.nameN,a)});
 const latest=new Map();ap.slice().sort((a,b)=>(a.date||0)-(b.date||0)).forEach(a=>latest.set(a.key,a));
 INV=J("Invoice").filter(r=>String(r["Invoice Status"]).toLowerCase()!="void"&&r["Invoice Date"]).map(r=>{
  const d=dt(r["Invoice Date"]),ph=last10(r["Billing Phone"])||last10(r["Shipping Phone"]),nm=norm(r["Customer Name"]);
  let m=null,how="No appointment";if(ph&&keys.has(ph)){m=latest.get(ph);how="Mobile"}else if(nm&&n2k.has(nm)){m=latest.get(n2k.get(nm).key);how="Name"}
  return{d,wd:d.getDay(),ds:ymd(d),mo:ymd(d).slice(0,7),fy:fyOf(d),inv:r["Invoice Number"],ch:r.Channels||"Unassigned",sp:(r["Sales Person"]||"Unassigned").trim(),
   cust:r["Customer Name"],ph:r["Billing Phone"],cat:r["Category Name"]||"Uncategorised",item:r["Item Name"]||"",qty:+r.Quantity||0,gross:+r.Gross||0,it:+r["Item Total"]||0,tax:+r["Item Tax Amount"]||0,
   apptNo:m?m.no:"",key:m?m.key:null,how,has:m?"Yes":"No",doc:m?m.doc:"",tag:m?m.tag:""}});
 AP=ap;
 const rows=XLSX.utils.sheet_to_json(wb.Sheets["Targets"],{header:1,raw:true,defval:null});
 TG=[];let type="aop",hdr=null,ci=0;
 rows.forEach(r=>{const j=r.findIndex(c=>String(c).trim()=="Channels"),first=r.map(c=>String(c??"").toUpperCase()).join("|");
  if(j<0&&first.includes("INTERNAL"))type="int";else if(j<0&&first.includes("AOP"))type="aop";
  if(j>=0){hdr=r;ci=j;return}
  if(!hdr)return;const ch=r[ci];if(!ch||String(ch).toLowerCase()=="total")return;
  for(let c=ci+1;c<r.length;c++){const d=dt(hdr[c]);if(d&&r[c]!=null)TG.push({ch:String(ch).trim(),type,mo:ymd(d).slice(0,7),t:+r[c]})}});
 const u=a=>[...new Set(a)].sort();
 $("fFY").innerHTML='<option value="">All</option>'+u(INV.map(x=>x.fy)).map(x=>`<option>${x}</option>`).join("");
 $("fMo").innerHTML='<option value="">All</option>'+u(INV.map(x=>x.mo)).map(x=>`<option>${x}</option>`).join("");
 $("fCh").innerHTML='<option value="">All</option>'+u(INV.map(x=>x.ch)).map(x=>`<option>${x}</option>`).join("");
 const ds=u(INV.map(x=>x.ds));$("fFrom").value=ds[0];$("fTo").value=ds[ds.length-1];
 ["fFY","fMo","fFrom","fTo","fCh"].forEach(i=>$(i).onchange=render);
 $("empty").classList.add("hide");$("body").classList.remove("hide");render()}
// ===== render =====
function render(){
 const F=$("fFY").value,M=$("fMo").value,a=$("fFrom").value,b=$("fTo").value,C=$("fCh").value;
 const inv=INV.filter(x=>(!F||x.fy==F)&&(!M||x.mo==M)&&(!C||x.ch==C)&&x.ds>=a&&x.ds<=b);
 const ap=AP.filter(x=>x.date&&ymd(x.date)>=a&&ymd(x.date)<=b);
 
 s1(inv,M,a,b,C);s2(ap,inv);s3(inv);s4(inv)}
function s1(inv,M,a,b,C){
 const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
 const hid=c=>/hubb|mall of india/i.test(c);
 const lab=d=>d.getDate()+" "+MON[d.getMonth()],bl=l=>new Set(l.map(x=>x.inv)).size;
 const gr=p=>p==null?"–":`<b style="color:${p>=0?GREEN:RED}">${p>=0?"+":""}${p.toFixed(1)}%</b>`;
 const mos=new Set();for(let d=new Date(a+"T00:00");d<=new Date(b+"T00:00");d.setDate(d.getDate()+1))mos.add(ymd(d).slice(0,7));

 const RV=R.filter(r=>!hid(r.c)).sort((x,y)=>(y.ta?y.g/y.ta:-1)-(x.ta?x.g/x.ta:-1));chart("c1","bar",RV.map(r=>r.c),[{label:"AOP",data:RV.map(r=>r.ta),backgroundColor:NAVY},{label:"Internal",data:RV.map(r=>r.ti),backgroundColor:"#7A9BAA"},{label:"Achieved",data:RV.map(r=>r.g),backgroundColor:GREEN}],{plugins:{title:{display:true,text:"AOP & Internal targets vs Achieved"}}});

function s2(ap0,inv){

function s3(inv0){
